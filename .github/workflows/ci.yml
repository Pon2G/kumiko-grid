name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        run: npm ci --no-audit --no-fund

      - name: Unit Testを実行
        run: npm test

      - name: アプリケーションをBuild
        run: npm run build
