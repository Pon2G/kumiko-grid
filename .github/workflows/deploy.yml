name: GitHub Pagesへデプロイ

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v7

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v6

      - name: 依存関係をインストール
        run: npm ci --no-audit --no-fund

      - name: Test Contractを検証
        run: npm run test:contracts

      - name: Unit Testを実行
        run: npm test

      - name: アプリケーションをBuild
        run: npm run build

      - name: GitHub Pages用artifactをアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v5
